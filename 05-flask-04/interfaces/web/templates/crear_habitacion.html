{% extends "base.html" %}

{% block contenido %}

<h2>
    Crear habitación
</h2>

{% if error %}

<p style="color:red;">

    {{ error }}

</p>

{% endif %}

<form

    method="post"

    action="{{ url_for('crear_habitacion') }}"
>

    <label>

        Nombre:

    </label>

    <input

        type="text"

        name="nombre"

        value="{{ nombre }}"
    >

    <button type="submit">

        Crear

    </button>

</form>

{% endblock %}
